name: Update Changelog in Docs

on:
  release:
    types: [published]

jobs:
  update-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update Changelog File
        run: |
          # Prepare the new changelog entry
          CHANGELOG_ENTRY="### ${{ github.event.release.tag_name }} ($(date +'%Y-%m-%d'))\n\n${{ github.event.release.body }}\n\n---\n\n<!-- LATEST_RELEASE_MARKER -->"

          # Use awk to replace the placeholder line. This is more robust than sed with line numbers.
          awk -v new_entry="$CHANGELOG_ENTRY" '
          /<!-- LATEST_RELEASE_MARKER -->/ { print new_entry; next }
          { print }
          ' docs/changelog.md > temp_changelog.md && mv temp_changelog.md docs/changelog.md

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/changelog.md
          git commit -m "docs: automatische changelog update voor ${{ github.event.release.tag_name }}"
          git push
