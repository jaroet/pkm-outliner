name: Update Changelog in Docs

on:
  release:
    types: [published]

jobs:
  update-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for all tags

      - name: Update Changelog File
        run: |
          # Get the previous tag, otherwise fall back to the first commit
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 `git rev-list --tags --skip=1 --max-count=1` 2>/dev/null || git rev-list --max-parents=0 HEAD)
          NEW_TAG=${{ github.event.release.tag_name }}

          # Get commit messages between the two tags, formatted as a list
          COMMIT_LOG=$(git log ${PREVIOUS_TAG}..${NEW_TAG} --pretty=format:"- %s")

          CHANGELOG_ENTRY="## ${NEW_TAG} - ($(date +'%Y-%m-%d'))\n${COMMIT_LOG}\n\n---\n\n<!-- LATEST_RELEASE_MARKER -->"

          awk -v new_entry="$CHANGELOG_ENTRY" '
          /<!-- LATEST_RELEASE_MARKER -->/ { print new_entry; next }
          { print }
          ' docs/changelog.md > temp_changelog.md && mv temp_changelog.md docs/changelog.md

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/changelog.md
          git commit -m "docs: automatische changelog update voor ${{ github.event.release.tag_name }}"
          git push
