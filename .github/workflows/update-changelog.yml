name: Update Changelog in Docs

on:
  release:
    types: [published]

jobs:
  update-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for all tags

      - name: Update Changelog File
        run: |
          # Get the previous tag, otherwise fall back to the first commit
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 `git rev-list --tags --skip=1 --max-count=1` 2>/dev/null || git rev-list --max-parents=0 HEAD)
          NEW_TAG=${{ github.event.release.tag_name }}
          # Strip the 'v' prefix from the tag (e.g. "v0.8.3" -> "0.8.3")
          NEW_VERSION=${NEW_TAG#v}

          # Get all commit messages between the two tags, formatted as a list
          # and sorted alphabetically (so "Added:" entries come before "Fixed:" ones)
          COMMIT_LOG=$(git log ${PREVIOUS_TAG}..${NEW_TAG} --pretty=format:"- %s" | sort)

          CHANGELOG_ENTRY="## [${NEW_VERSION}] - Current Release\n${COMMIT_LOG}\n\n<!-- LATEST_RELEASE_MARKER -->"

          awk -v new_entry="$CHANGELOG_ENTRY" '
          /<!-- LATEST_RELEASE_MARKER -->/ { print new_entry; after_marker=1; next }
          after_marker && /^## .* - Current Release$/ { sub(/ - Current Release$/, " - Previous Release"); print; after_marker=0; next }
          { print }
          ' docs/changelog.md > temp_changelog.md && mv temp_changelog.md docs/changelog.md

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/changelog.md
          git commit -m "docs: update changelog for ${{ github.event.release.tag_name }}"
          git push
